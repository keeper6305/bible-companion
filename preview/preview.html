<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>미리보기 · 바이블 컴패니언</title>
<style>
  html,body{margin:0;background:#e9e4da;font-family:system-ui,sans-serif}
  .wrap{display:flex;gap:14px;justify-content:center;align-items:flex-start;padding:14px}
  .cap{font-size:11px;color:#5b5348;margin-bottom:5px;text-align:center}
  iframe{border:1px solid #b9b0a2;border-radius:14px;background:#fff;box-shadow:0 8px 24px rgba(0,0,0,.12);display:block}
</style>
</head>
<body>
<div class="wrap" id="wrap"></div>
<script>
  (function () {
    var p = new URLSearchParams(location.search);
    var w = parseInt(p.get('w') || '360', 10);
    var h = parseInt(p.get('h') || '780', 10);
    var theme = p.get('theme') || '';
    var routes = (p.get('m') || p.get('r') || 'home').split(',');
    var scroll = parseInt(p.get('scroll') || '0', 10);
    var wrap = document.getElementById('wrap');
    routes.forEach(function (r) {
      var box = document.createElement('div');
      var cap = document.createElement('div');
      cap.className = 'cap';
      cap.textContent = w + ' · #/' + r;
      var f = document.createElement('iframe');
      f.width = w; f.height = h;
      f.src = './index.html#/' + r;
      f.onload = function () {
        if (theme) {
          try { f.contentWindow.document.documentElement.setAttribute('data-theme', theme); } catch (e) { }
        }
        if (scroll) {
          setTimeout(function () { try { f.contentWindow.scrollTo(0, scroll); } catch (e) { } }, 1200);
        }
      };
      box.appendChild(cap); box.appendChild(f); wrap.appendChild(box);
    });
    document.title = '미리보기 · ' + routes.join(' / ');
  })();
</script>
</body>
</html>
