<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QA · 바이블 컴패니언 v6.0</title>
<style>
  body{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;margin:16px;background:#fff;color:#111;font-size:12px}
  h1{font-size:15px;margin:0 0 10px}
  pre{white-space:pre-wrap;line-height:1.5;background:#f6f6f6;padding:12px;border-radius:8px}
  .f{position:absolute;left:-9999px;top:0;border:0}
  iframe{border:1px solid #ccc}
  #shotbox{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
  #shotbox figure{margin:0}
  #shotbox figcaption{font-size:11px;color:#555;padding:4px 0}
</style>
</head>
<body>
<h1>QA harness v6.0 — 360 / 390 / 430</h1>
<p style="margin:0 0 10px">측정: <code>qa.html</code> · 화면 캡처: <code>qa.html#shot?w=360&amp;p=chapter</code>
(p = home / goal / bible / book / bookheb / chapter / chapter2 / verse / sheet / pref / notes / searchbook / word)</p>
<pre id="out">running…</pre>
<div id="frames"></div>
<div id="shotbox"></div>
<script>
(function () {
  var WIDTHS = [360, 390, 430];
  var ROUTES = [
    ['home', '#/home'],
    ['bible-home', '#/bible'],
    ['book-psa', '#/bible/psa'],
    ['book-gen', '#/bible/gen'],
    ['book-heb', '#/bible/heb'],
    ['chapter-gen1', '#/bible/gen/1'],
    ['chapter-psa23', '#/bible/psa/23?v=1'],
    ['chapter-rev21', '#/bible/rev/21'],
    ['verse-detail', '#/verse/jhn-3-16'],
    ['people-list', '#/per'],
    ['person-detail', '#/per/elijah'],
    ['situation', '#/sit/waiting'],
    ['background-list', '#/bg'],
    ['word-detail', '#/word/hesed'],
    ['notes', '#/notes'],
    ['search-word', '#/search?q=%EC%9D%80%ED%98%9C'],
    ['search-book', '#/search?q=%EC%9A%94%ED%95%9C%EB%B3%B5%EC%9D%8C'],
    ['about', '#/about']
  ];
  var PAGES = {
    home: '#/home', bible: '#/bible', book: '#/bible/psa', bookheb: '#/bible/heb',
    chapter: '#/bible/gen/1', chapter2: '#/bible/psa/23?v=1', verse: '#/verse/jhn-3-16',
    searchbook: '#/search?q=' + encodeURIComponent('히브리서'), word: '#/word',
    sheet: '#/bible/gen/1', pref: '#/bible/gen/1', notes: '#/notes', bookgen: '#/bible/gen',
    goal: '#/home', bar: '#/bible/psa/119'
  };
  var QA = '?qa=1';
  var out = document.getElementById('out');
  var result = { version: 'v6.0', widths: {}, counts: {}, functional: {}, checks: [], errors: [] };

  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  /* 조건이 만족될 때까지 짧게 폴링 — 네트워크가 느린 순간을 고정 대기로 재면 오탐이 난다 */
  async function waitFor(fn, timeout) {
    var t0 = Date.now();
    while (Date.now() - t0 < (timeout || 3000)) {
      try { if (fn()) return true; } catch (e) { }
      await sleep(150);
    }
    return false;
  }

  function shotMode(hash) {
    var qs = hash.split('?')[1] || '';
    var q = {};
    qs.split('&').forEach(function (kv) {
      var p = kv.split('=');
      if (p[0]) q[p[0]] = decodeURIComponent(p[1] || '');
    });
    var w = parseInt(q.w, 10) || 360;
    var y = parseInt(q.y, 10) || 0;
    var page = PAGES[q.p] || '#/home';
    /* seed=1: 화면 확인용 예시 상태(읽은 장·목표·형광펜 메모)를 점검 키에만 심는다 */
    if (q.seed) {
      try {
        var d0 = new Date(), at = d0.toISOString();
        var k0 = d0.getFullYear() + '-' + String(d0.getMonth() + 1).padStart(2, '0') + '-' + String(d0.getDate()).padStart(2, '0');
        var days = {}; days[k0] = 3;
        localStorage.setItem('bc.state.v1:qa', JSON.stringify({
          bookmarks: [{ ref: 'bv:gen:1:1', at: at }],
          notes: [{ id: 'n1', ref: 'bv:gen:1:3', title: '빛에 대한 묵상', body: '혼돈과 공허 한가운데서도 말씀은 이미 일하고 계셨다.', createdAt: at, updatedAt: at }],
          read: { 'gen:1': at, 'gen:2': at, 'gen:3': at }, days: days,
          last: { b: 'gen', ch: 3, at: at }, pref: { goal: 3 },
          hl: [
            { ref: 'bv:gen:1:1', c: 'y', t: '태초에 하나님이 천지를 창조하시니라', n: '시작의 첫 문장', at: at },
            { ref: 'bv:gen:1:3', c: 'g', t: '하나님이 가라사대 빛이 있으라 하시매 빛이 있었고', n: '말씀과 성취 사이의 간격 없음', at: at },
            { ref: 'bv:gen:1:4', c: 'b', t: '그 빛이 하나님의 보시기에 좋았더라 하나님이 빛과 어두움을 나누사', n: '', at: at }
          ]
        }));
      } catch (e) { }
    }
    document.querySelector('h1').textContent = '미리보기 ' + w + 'px · ' + page + (y ? ' · y=' + y : '');
    out.style.display = 'none';
    var fig = document.createElement('figure');
    var cap = document.createElement('figcaption');
    cap.textContent = w + 'px · ' + page + (y ? ' (스크롤 ' + y + ')' : '');
    var frame = document.createElement('iframe');
    frame.width = w; frame.height = 780; frame.src = './index.html?qa=1&v=' + Date.now() + page;
    frame.onload = function () {
      setTimeout(function () {
        try {
          if (q.p === 'sheet') {
            var row = frame.contentWindow.document.querySelector('#view .vblock[data-v="1"] .vrow');
            if (row) row.click();
          }
          if (q.p === 'pref') {
            var aa = frame.contentWindow.document.querySelector('#view [data-act="rdpref"]');
            if (aa) aa.click();
          }
          if (y) frame.contentWindow.scrollTo(0, y);
        } catch (e) { }
      }, 1600);
    };
    fig.appendChild(cap); fig.appendChild(frame);
    document.getElementById('shotbox').appendChild(fig);
    result.mode = 'shot';
    window.__qa = result;
    return true;
  }

  function measure(win, W) {
    var doc = win.document;
    var de = doc.documentElement;
    var over = [];
    var nodes = doc.querySelectorAll('body *');
    for (var i = 0; i < nodes.length; i++) {
      var el = nodes[i];
      if (el.id === 'toast') continue;
      if (el.closest && el.closest('#toast')) continue;
      if (el.closest && el.closest('.chips')) continue; /* 의도된 가로 스크롤 칩 줄 */
      var r = el.getBoundingClientRect();
      if (!r.width && !r.height) continue;
      if (r.right > W + 1.5 || r.left < -1.5) {
        over.push(el.tagName.toLowerCase() + (el.id ? '#' + el.id : '') + '.' + String(el.className || '').slice(0, 30) + ' [' + Math.round(r.left) + ',' + Math.round(r.right) + ']');
      }
    }
    var view = doc.getElementById('view');
    var vt = doc.querySelector('#view .vt');
    return {
      width: W,
      hOverflow: de.scrollWidth - de.clientWidth,
      overflowCount: over.length,
      overflow: over.slice(0, 6),
      textLen: view ? view.innerText.replace(/\s+/g, ' ').trim().length : 0,
      items: doc.querySelectorAll('#view .item').length,
      books: doc.querySelectorAll('#view .bkbtn').length,
      chapters: doc.querySelectorAll('#view .chbtn').length,
      chaptersRead: doc.querySelectorAll('#view .chbtn.rd').length,
      readerVerses: doc.querySelectorAll('#view .vblock').length,
      readerBadges: doc.querySelectorAll('#view .vhd').length,
      hlBlocks: doc.querySelectorAll('#view .vblock[class*="hl-"]').length,
      guide: doc.querySelectorAll('#view .guide').length,
      guideOpen: doc.querySelectorAll('#view .guide.on').length,
      chapintro: doc.querySelectorAll('#view .chapintro').length,
      chapIntroOpen: doc.querySelectorAll('#view .chapintro.wide').length,
      chapLines: doc.querySelectorAll('#view .chapintro .ciline').length,
      tools: doc.querySelectorAll('#view .rtools').length,
      readBtn: doc.querySelectorAll('#view [data-act="readmark"]').length,
      progBars: doc.querySelectorAll('#view .pbar').length,
      tread: (doc.querySelector('#view .tread') || {}).textContent ? doc.querySelector('#view .tread').textContent.replace(/\s+/g, ' ').trim().slice(0, 90) : '',
      bookcards: doc.querySelectorAll('#view .bookcard').length,
      textSearchHits: doc.querySelectorAll('#view .vhit').length,
      hlNotes: doc.querySelectorAll('#view .hli').length,
      rdbar: doc.querySelectorAll('#view .rdbar').length,
      goalCards: doc.querySelectorAll('#view .goalcard').length,
      goalChips: doc.querySelectorAll('#view .goalcard .gchip').length,
      navTabs: doc.querySelectorAll('#tabs .nb').length,
      vtFontSize: vt ? win.getComputedStyle(vt).fontSize : '',
      errs: (win.__errs || []).slice(0, 5)
    };
  }

  function check(name, ok, actual) {
    result.checks.push({ name: name, ok: !!ok, actual: actual === undefined ? '' : actual });
    return !!ok;
  }

  async function run() {
    for (var w = 0; w < WIDTHS.length; w++) {
      var W = WIDTHS[w];
      try { localStorage.removeItem('bc.state.v1:qa'); localStorage.removeItem('bc.theme.v1:qa'); } catch (e) { }
      if (W === 360) {
        /* v4.0 저장 형식(북마크·노트만)으로 시작해 새 필드를 더해도 기존 데이터가 남는지 본다 */
        try {
          localStorage.setItem('bc.state.v1:qa', JSON.stringify({
            bookmarks: [{ ref: 'sit:waiting', at: '2026-11-18T10:00:00.000Z' }],
            notes: [{ id: 'nold1', title: '지난 노트', body: 'v4.0에서 쓴 묵상', createdAt: '2026-11-18T10:00:00.000Z', updatedAt: '2026-11-18T10:00:00.000Z' }]
          }));
        } catch (e) { }
      }
      var frame = document.createElement('iframe');
      frame.className = 'f';
      frame.width = W; frame.height = 780;
      frame.setAttribute('allow', 'clipboard-write');
      frame.src = './index.html' + QA + '&cb=' + Date.now() + '#/home';
      document.getElementById('frames').appendChild(frame);
      await new Promise(function (res) { frame.onload = res; });
      await sleep(900);
      var win = frame.contentWindow;
      var doc = win.document;
      result.widths[W] = {};

      if (W === 360) {
        result.counts = {
          booksData: (win.BC.books || []).length,
          guideData: Object.keys(win.BC.bookGuide || {}).length,
          vmapData: Object.keys(win.BC.vmap || {}).length,
          words: (win.BC.words || []).length,
          peopleData: (win.BC.characters || []).length,
          versesData: (win.BC.verses || []).length,
          totalChapters: (win.BC.books || []).reduce(function (n, b) { return n + b.ch; }, 0)
        };
      }

      for (var i = 0; i < ROUTES.length; i++) {
        var name = ROUTES[i][0], hash = ROUTES[i][1];
        win.location.hash = hash;
        await sleep(i === 0 ? 700 : 950);
        var m = measure(win, W);
        m.route = name;
        result.widths[W][name] = m;
        if (m.errs.length) result.errors.push({ w: W, route: name, errs: m.errs });
      }

      if (W === 360) {
        try {
          check('점검 모드 저장 키 분리', win.BC.stateKey === 'bc.state.v1:qa', String(win.BC.stateKey));
          var store = function () {
            try { return JSON.parse(win.localStorage.getItem('bc.state.v1:qa') || '{}'); } catch (e) { return {}; }
          };

          /* ── 0. v4.0 저장소 호환 ── */
          var seeded = store();
          check('v4 북마크 유지', (seeded.bookmarks || []).length === 1, JSON.stringify(seeded.bookmarks || []));
          check('v4 노트 유지', (seeded.notes || []).length === 1 && seeded.notes[0].title === '지난 노트', (seeded.notes || []).length);
          win.location.hash = '#/notes';
          await sleep(700);
          check('노트 화면에 기존 노트 보임', (doc.querySelector('#view') || {}).textContent.indexOf('지난 노트') >= 0, '');

          /* ── 1. 통독: 장 읽음 표시 ── */
          win.location.hash = '#/bible/gen/1';
          await sleep(1100);
          var rbtn = doc.querySelector('#view [data-act="readmark"]');
          check('읽기 도구줄 표시', !!rbtn, rbtn ? rbtn.textContent.trim() : 'none');
          if (rbtn) rbtn.click();
          await sleep(700);
          var st1 = store();
          check('읽음 기록 저장(gen:1)', !!(st1.read && st1.read['gen:1']), st1.read ? Object.keys(st1.read).join(',') : 'no read');
          check('오늘 읽은 장 수 1', st1.days && Object.values(st1.days)[0] === 1, JSON.stringify(st1.days || {}));
          var rb2 = doc.querySelector('#view [data-act="readmark"]');
          check('읽음 버튼 눌림 상태', rb2 && rb2.getAttribute('aria-pressed') === 'true', rb2 ? rb2.getAttribute('aria-pressed') : 'none');
          var endTxt = (doc.querySelector('#view .chapend') || {}).textContent || '';
          check('장 끝 읽음·이어읽기 버튼', endTxt.indexOf('2장 이어 읽기') >= 0, endTxt.replace(/\s+/g, ' ').trim());

          /* ── 2. 책 화면 진도 ── */
          win.location.hash = '#/bible/gen';
          await sleep(800);
          var rdCh = doc.querySelectorAll('#view .chbtn.rd').length;
          var bookProg = (doc.querySelector('#view .tread') || {}).textContent || '';
          check('장 격자 읽음 표시 1개', rdCh === 1, 'rd=' + rdCh);
          check('책 진도 표시', bookProg.replace(/\s+/g, '').indexOf('통독1/50장') >= 0, bookProg.replace(/\s+/g, ' ').trim());
          check('이어 읽기 버튼(2장부터)', ((doc.querySelector('#view .actrow .btn.primary') || {}).textContent || '').indexOf('2장부터') >= 0, (doc.querySelector('#view .actrow .btn.primary') || {}).textContent);

          /* ── 3. 성경 목록 진도 ── */
          win.location.hash = '#/bible';
          await sleep(700);
          var bibleProg = (doc.querySelector('#view .tread') || {}).textContent || '';
          check('전체 진도 1/1,189', bibleProg.replace(/\s+/g, '').indexOf('1/1,189장') >= 0, bibleProg.replace(/\s+/g, ' ').trim());
          var genBar = doc.querySelector('#view .bkbtn .pgl i');
          check('책별 진행 막대', !!genBar, genBar ? genBar.style.width : 'none');

          /* ── 4. 홈 이어 읽기 카드 ── */
          win.location.hash = '#/home';
          await sleep(700);
          var homeCard = (doc.querySelector('#view .tread') || {}).textContent || '';
          check('홈 통독 카드', homeCard.indexOf('성경 통독') >= 0, homeCard.replace(/\s+/g, ' ').trim());
          var go = doc.querySelector('#view .tread');
          check('홈 카드 이어 읽기 링크', go && go.getAttribute('data-go') === '#/bible/gen/2', go ? go.getAttribute('data-go') : 'none');

          /* ── 5. 구절 시트: 절 이동·형광펜·복사 ── */
          win.location.hash = '#/bible/gen/1';
          await sleep(1000);
          var row = doc.querySelector('#view .vblock[data-v="1"] .vrow');
          if (row) row.click();
          await sleep(500);
          check('시트 열림', !!doc.querySelector('#sheetHost.on .sheet'), '');
          check('시트 절 이동 버튼', doc.querySelectorAll('#sheetHost .svbtn').length === 2, doc.querySelectorAll('#sheetHost .svbtn').length);
          check('이전 절 비활성(1절)', (doc.querySelector('#sheetHost .svbtn') || {}).disabled === true, '');
          var sw = doc.querySelectorAll('#sheetHost .hlsw');
          check('형광펜 색 4종', sw.length === 4, sw.length);
          var nextBtn = doc.querySelectorAll('#sheetHost .svbtn')[1];
          if (nextBtn) nextBtn.click();
          await sleep(450);
          check('다음 절 이동(1:2)', ((doc.querySelector('#sheetHost .shead h2') || {}).textContent || '') === '창세기 1:2', (doc.querySelector('#sheetHost .shead h2') || {}).textContent);
          var copyBtn = doc.querySelector('#sheetHost [data-act="copyv"]');
          if (copyBtn) copyBtn.click();
          await sleep(400);
          var copyTxt = win.BC.lastCopy || '';
          check('복사 문자열 구성', copyTxt.indexOf('창세기 1:2') >= 0 && copyTxt.indexOf('개역한글판') >= 0, copyTxt.replace(/\n/g, ' | ').slice(0, 80));
          var copyToast = (doc.getElementById('toast') || {}).textContent || '';
          result.functional.copyToast = copyToast;
          var ySw = doc.querySelector('#sheetHost .hlsw.y');
          if (ySw) ySw.click();
          await sleep(400);
          var st2 = store();
          check('형광펜 저장', (st2.hl || []).length === 1, JSON.stringify((st2.hl || []).map(function (h) { return h.ref + ':' + h.c; })));
          check('형광펜 시트 선택 표시', !!(doc.querySelector('#sheetHost .hlsw.y.on')), '');
          if (ySw) ySw.click(); /* 같은 색을 다시 누르면 해제 */
          await sleep(400);
          check('형광펜 같은 색 재클릭 해제', (store().hl || []).length === 0, JSON.stringify((store().hl || []).length));
          var ySw2 = doc.querySelector('#sheetHost .hlsw.y');
          if (ySw2) ySw2.click();
          await sleep(300);
          if (doc.querySelector('#sheetHost .sclose')) doc.querySelector('#sheetHost .sclose').click();
          await sleep(350);
          check('본문에 형광펜 표시', !!doc.querySelector('#view .vblock[data-ref="bv:gen:1:2"].hl-y'), '');

          /* ── 6. 읽기 설정 ── */
          var aa = doc.querySelector('#view [data-act="rdpref"]');
          if (aa) aa.click();
          await sleep(450);
          check('읽기 설정 시트', doc.querySelectorAll('#sheetHost .rset .rrow').length === 3, doc.querySelectorAll('#sheetHost .rset .rrow').length);
          var big = doc.querySelector('#sheetHost [data-k="fs"][data-v="3"]');
          if (big) big.click();
          await sleep(500);
          var fsAfter = win.getComputedStyle(doc.querySelector('#view .vt')).fontSize;
          check('글자 크기 적용', parseFloat(fsAfter) >= 18, fsAfter);
          check('글자 크기 저장', store().pref && store().pref.fs === 3, JSON.stringify(store().pref || {}));
          var normal = doc.querySelector('#sheetHost [data-k="fs"][data-v="1"]');
          if (normal) normal.click();
          await sleep(400);
          if (doc.querySelector('#sheetHost .sclose')) doc.querySelector('#sheetHost .sclose').click();
          await sleep(350);

          /* ── 6b. 시트 안에서 다른 화면으로 이동하면 시트가 닫힌다 ── */
          if (doc.querySelector('#sheetHost.on')) {
            var cl0 = doc.querySelector('#sheetHost .sclose'); if (cl0) cl0.click();
            await sleep(400);
          }
          win.location.hash = '#/bible/gen/1';
          await sleep(1000);
          var row1 = doc.querySelector('#view .vblock[data-v="1"] .vrow');
          if (row1) row1.click();
          await sleep(500);
          var hd = doc.querySelector('#sheetHost [data-go^="#/verse/"]');
          if (hd) hd.click();
          await sleep(900);
          check('시트에서 해설로 이동', win.location.hash.indexOf('#/verse/') === 0 && !doc.querySelector('#sheetHost.on'), win.location.hash);

          /* ── 7. 장 배경 12/12 ── */
          var chapters = [['gen', 1], ['gen', 50], ['exo', 20], ['psa', 23], ['psa', 119], ['isa', 53], ['jhn', 3], ['rom', 8], ['rev', 22], ['rut', 1], ['oba', 1], ['3jn', 1]];
          var okCi = 0, ciFail = [];
          for (var c = 0; c < chapters.length; c++) {
            win.location.hash = '#/bible/' + chapters[c][0] + '/' + chapters[c][1];
            var okChapter = await waitFor(function () {
              var els = doc.querySelectorAll('#view .chapintro .ciline');
              var txt = Array.prototype.map.call(els, function (x) { return x.textContent; }).join('');
              return els.length === 3 && txt.replace(/\s+/g, '').length > 40;
            }, 4000);
            if (okChapter) okCi++; else ciFail.push(chapters[c].join(':'));
          }
          check('장 배경 12/12', okCi === 12, okCi + '/12 fail=' + ciFail.join(','));

          /* ── 8. 66권 개관 표본 12권 ── */
          var checkBooks = ['gen', 'exo', 'lev', 'psa', 'isa', 'jer', 'mat', 'jhn', 'act', 'rom', 'heb', 'rev'];
          var g = 0;
          for (var b = 0; b < checkBooks.length; b++) {
            win.location.hash = '#/bible/' + checkBooks[b];
            if (await waitFor(function () { return !!doc.querySelector('#view .guide.on'); }, 2500)) g++;
          }
          check('책 개관 12/12', g === 12, g + '/12');

          /* ── 9. 노트 화면: 통독·형광펜 ── */
          win.location.hash = '#/notes';
          await sleep(700);
          check('노트 화면 통독 요약', ((doc.querySelector('#view .tread') || {}).textContent || '').indexOf('통독') >= 0, (doc.querySelector('#view .tread') || {}).textContent);
          check('노트 화면 형광펜 목록', doc.querySelectorAll('#view .hli').length === 1, doc.querySelectorAll('#view .hli').length);

          /* ── 10. 검색(책·본문) ── */
          win.location.hash = '#/search?q=' + encodeURIComponent('히브리서');
          await sleep(800);
          check('책 검색 결과 카드', doc.querySelectorAll('#view .bookcard').length >= 1, doc.querySelectorAll('#view .bookcard').length);
          win.location.hash = '#/search?q=' + encodeURIComponent('은혜');
          await sleep(3600);
          check('본문 키워드 검색', doc.querySelectorAll('#view .vhit').length > 0, doc.querySelectorAll('#view .vhit').length);

          /* ── 11. 다크 모드 ── */
          var th = doc.getElementById('themeBtn');
          if (th) th.click();
          await sleep(300);
          check('다크 모드 전환', doc.documentElement.getAttribute('data-theme') === 'dark', doc.documentElement.getAttribute('data-theme'));
          if (th) th.click();
          await sleep(250);
          check('라이트 복귀', doc.documentElement.getAttribute('data-theme') === 'light', doc.documentElement.getAttribute('data-theme'));

          /* ── 12. 뒤로가기: 목록 → 책 → 장 (UI 클릭 경로) ── */
          win.location.hash = '#/bible';
          await sleep(800);
          var bkGen = Array.prototype.filter.call(doc.querySelectorAll('#view .bkbtn'), function (b) { return b.getAttribute('data-go') === '#/bible/gen'; })[0];
          if (bkGen) bkGen.click();
          await sleep(900);
          var ch1 = doc.querySelector('#view .chbtn');
          if (ch1) ch1.click();
          await sleep(1100);
          result.functional.uiPath = win.location.hash;
          var chain = [];
          win.history.back();
          await sleep(700);
          chain.push(win.location.hash);
          win.history.back();
          await sleep(700);
          chain.push(win.location.hash);
          result.functional.backChain = chain.join(' → ');
          check('뒤로가기 장→책→목록', chain[0] === '#/bible/gen' && chain[1] === '#/bible', chain.join(' → '));

          /* ── 13. 시트 열린 상태 뒤로가기: 시트만 닫힘 ── */
          win.location.hash = '#/bible/psa/23';
          await sleep(1000);
          var beforeHash = win.location.hash;
          var pr = doc.querySelector('#view .vblock[data-v="1"] .vrow');
          if (pr) pr.click();
          await sleep(450);
          var opened = !!doc.querySelector('#sheetHost.on .sheet');
          win.history.back();
          await sleep(650);
          result.functional.sheetBack = { opened: opened, closed: !doc.querySelector('#sheetHost.on'), hash: win.location.hash, before: beforeHash };
          check('시트 뒤로가기 = 시트만 닫힘', opened && !doc.querySelector('#sheetHost.on') && win.location.hash === beforeHash, JSON.stringify(result.functional.sheetBack));

          /* ── 14. 시트를 ✕로 닫으면 히스토리 칸을 소비 ── */
          var pr2 = doc.querySelector('#view .vblock[data-v="1"] .vrow');
          if (pr2) pr2.click();
          await sleep(450);
          var xb = doc.querySelector('#sheetHost .sclose');
          if (xb) xb.click();
          await sleep(650);
          check('✕ 닫기 후 같은 화면 유지', !doc.querySelector('#sheetHost.on') && win.location.hash === beforeHash, win.location.hash);
          win.history.back();
          await sleep(700);
          result.functional.afterXBack = win.location.hash;
          check('✕ 닫은 뒤 뒤로가기 = 이전 화면', win.location.hash !== beforeHash, win.location.hash);

          /* ── 15. v6.0 하단 고정 읽기 바 ── */
          win.scrollTo(0, 0);
          win.location.hash = '#/bible/gen/2';
          await sleep(1300);
          var bar = doc.querySelector('#view .rdbar');
          var navR = doc.getElementById('tabs').getBoundingClientRect();
          check('하단 바 표시', !!bar, bar ? bar.textContent.replace(/\s+/g, ' ').trim() : 'none');
          var barR = bar ? bar.getBoundingClientRect() : { bottom: 0, height: 0, left: 0, right: 0 };
          check('하단 바가 탭바 위에 붙음', Math.abs(barR.bottom - navR.top) <= 1.5, Math.round(barR.bottom) + ' / ' + Math.round(navR.top));
          check('하단 바 가로 폭 안', barR.left >= -1.5 && barR.right <= W + 1.5, Math.round(barR.left) + '~' + Math.round(barR.right));
          var padB = parseFloat(win.getComputedStyle(doc.getElementById('view')).paddingBottom) || 0;
          check('본문 마지막 줄 가리지 않음', padB >= barR.height + navR.height, Math.round(padB) + ' vs ' + Math.round(barR.height + navR.height));
          var barMark = doc.querySelector('#view .rdbar [data-act="readmark"]');
          var barNext = doc.querySelector('#view .rdbar [data-act="rdnext"]');
          check('하단 바 두 버튼', !!barMark && !!barNext, (barMark || {}).textContent + ' / ' + (barNext || {}).textContent);
          if (barMark) barMark.click();
          await sleep(800);
          check('하단 바에서 읽음 기록', !!(store().read || {})['gen:2'], Object.keys(store().read || {}).join(','));
          var markNow = doc.querySelector('#view .rdbar .rbbtn.mark');
          check('하단 바 읽음 상태 반영', !!markNow && markNow.getAttribute('aria-pressed') === 'true' && markNow.textContent.indexOf('읽음') >= 0, markNow ? markNow.textContent : 'none');
          check('하단 바 오늘 장수', ((doc.querySelector('#view .rdbar .rbmline') || {}).textContent || '').indexOf('오늘 2장') >= 0, (doc.querySelector('#view .rdbar .rbmline') || {}).textContent);

          /* ── 16. 하루 목표 장수 ── */
          win.location.hash = '#/home';
          await sleep(900);
          var gchips = doc.querySelectorAll('#view .goalcard .gchip');
          check('홈 하루 목표 고르개 4개', gchips.length === 4, gchips.length);
          check('목표 미설정 안내', ((doc.querySelector('#view .goalcard .gfoot') || {}).textContent || '').indexOf('목표를 고르면') >= 0, (doc.querySelector('#view .goalcard .gfoot') || {}).textContent);
          if (gchips[1]) gchips[1].click();
          await sleep(800);
          check('하루 목표 저장', (store().pref || {}).goal === 2, JSON.stringify(store().pref || {}));
          var gfoot = ((doc.querySelector('#view .goalcard .gfoot') || {}).textContent || '').replace(/\s+/g, ' ').trim();
          check('오늘 n / M장 게이지', gfoot.indexOf('2 / 2장') >= 0, gfoot);
          check('목표 달성 표시', gfoot.indexOf('달성') >= 0, gfoot);
          var gbarW = doc.querySelector('#view .goalcard .gbar i');
          check('게이지 채움', !!gbarW && gbarW.style.width === '100%', gbarW ? gbarW.style.width : 'none');
          win.location.hash = '#/bible';
          await sleep(1000);
          check('성경 화면 목표 카드', doc.querySelectorAll('#view .goalcard.compact .gchip').length === 4, doc.querySelectorAll('#view .goalcard.compact .gchip').length);
          var gchipActive = doc.querySelector('#view .goalcard .gchip.on');
          if (gchipActive) gchipActive.click();
          await sleep(700);
          check('같은 칩 다시 누르면 목표 해제', (store().pref || {}).goal === 0, JSON.stringify(store().pref || {}));
          var gset = doc.querySelector('#view .goalcard [data-g="3"]');
          if (gset) gset.click();
          await sleep(700);
          check('하루 목표 3장', (store().pref || {}).goal === 3, JSON.stringify(store().pref || {}));
          check('목표 3장이면 미달 표시', ((doc.querySelector('#view .goalcard .grest') || {}).textContent || '').indexOf('1장') >= 0, (doc.querySelector('#view .goalcard .grest') || {}).textContent);

          /* ── 17. 다음 장 버튼: 읽음 자동 표시 후 이동 ── */
          win.location.hash = '#/bible/gen/3';
          await sleep(1200);
          var nx = doc.querySelector('#view .rdbar [data-act="rdnext"]');
          check('다음 장 버튼 라벨', !!nx && nx.textContent.indexOf('다음 장') >= 0, nx ? nx.textContent : 'none');
          if (nx) nx.click();
          await sleep(1100);
          check('다음 장 누르면 읽음 기록', !!(store().read || {})['gen:3'], Object.keys(store().read || {}).join(','));
          check('다음 장으로 이동', win.location.hash === '#/bible/gen/4', win.location.hash);
          check('이동한 장 하단 바 갱신', ((doc.querySelector('#view .rdbar .rbmline') || {}).textContent || '').indexOf('/ 3장') >= 0, (doc.querySelector('#view .rdbar .rbmline') || {}).textContent);

          /* ── 18. 형광펜 한 줄 메모 + 색별 모아보기 ── */
          win.location.hash = '#/bible/gen/1';
          await sleep(1300);
          var vrow2 = doc.querySelector('#view .vblock[data-v="2"] .vrow');
          if (vrow2) vrow2.click();
          await sleep(600);
          var noteIn = doc.getElementById('hlNote');
          check('절 시트 한 줄 메모 입력', !!noteIn, noteIn ? ('value=' + noteIn.value) : 'none');
          var nsave = doc.querySelector('#sheetHost [data-act="hlnote"]');
          if (noteIn) noteIn.value = '빛이 있으라 — 창조의 시작';
          if (nsave) nsave.click();
          await sleep(600);
          var st3 = store();
          check('형광펜 메모 저장', !!((st3.hl || [])[0]) && (st3.hl[0].n || '') === '빛이 있으라 — 창조의 시작', JSON.stringify(st3.hl || []));
          check('메모 저장 토스트', ((doc.getElementById('toast') || {}).textContent || '').indexOf('한 줄 메모') >= 0, (doc.getElementById('toast') || {}).textContent);
          var x2 = doc.querySelector('#sheetHost .sclose');
          if (x2) x2.click();
          await sleep(500);
          win.location.hash = '#/notes';
          await sleep(900);
          var hchips = doc.querySelectorAll('#view .chips.hlf .chip');
          check('색별 필터 5개', hchips.length === 5, hchips.length);
          check('노트에 한 줄 메모 표시', ((doc.querySelector('#view .hli') || {}).textContent || '').indexOf('창조의 시작') >= 0, (doc.querySelector('#view .hli') || {}).textContent);
          var gfc = doc.querySelector('#view .chips.hlf [data-c="g"]');
          if (gfc) gfc.click();
          await sleep(700);
          check('초록 필터 = 0건 + 안내', doc.querySelectorAll('#view .hli').length === 0 && ((doc.querySelector('#view .hli, #view .empty') || {}).textContent || '').indexOf('초록') >= 0, doc.querySelectorAll('#view .hli').length);
          var afc = doc.querySelector('#view .chips.hlf [data-c=""]');
          if (afc) afc.click();
          await sleep(700);
          check('전체 필터 복귀 1건', doc.querySelectorAll('#view .hli').length === 1, doc.querySelectorAll('#view .hli').length);

          /* ── 19. 스크롤해도 헤더 고정 (overflow-x:clip 회귀 방지) ── */
          win.location.hash = '#/bible/gen/1';
          await sleep(1300);
          win.scrollTo(0, 420);
          await sleep(350);
          var topT = doc.getElementById('top').getBoundingClientRect().top;
          check('스크롤해도 헤더 고정', Math.abs(topT) <= 2, Math.round(topT));
          check('스크롤해도 하단 바 고정', Math.abs(doc.querySelector('#view .rdbar').getBoundingClientRect().bottom - doc.getElementById('tabs').getBoundingClientRect().top) <= 1.5, Math.round(doc.querySelector('#view .rdbar').getBoundingClientRect().bottom));
          win.scrollTo(0, 0);

          /* ── 20. 첫 방문 팁 (빈 저장소 프레임) ── */
          try { win.localStorage.removeItem('bc.state.v1:qa'); } catch (e) { }
          var f2 = document.createElement('iframe');
          f2.className = 'f'; f2.width = W; f2.height = 780;
          f2.src = './index.html' + QA + '&tip=' + Date.now() + '#/bible/gen/1';
          document.getElementById('frames').appendChild(f2);
          await new Promise(function (res) { f2.onload = res; });
          await sleep(1300);
          var w2 = f2.contentWindow, d2 = w2.document;
          var tipEl = d2.getElementById('tipbox');
          check('첫 방문 팁 표시', !!tipEl && tipEl.textContent.indexOf('절을 탭하면') >= 0, tipEl ? tipEl.textContent.replace(/\s+/g, ' ').slice(0, 40) : 'none');
          var tgb = d2.querySelector('#tipbox .tipx');
          if (tgb) tgb.click();
          await sleep(500);
          var st4 = {};
          try { st4 = JSON.parse(w2.localStorage.getItem('bc.state.v1:qa') || '{}'); } catch (e) { }
          check('팁 닫으면 사라지고 저장', !d2.getElementById('tipbox') && (st4.pref || {}).tip1 === 1, JSON.stringify(st4.pref || {}));
          result.functional.errsTip = (w2.__errs || []).slice(0, 5);
          f2.remove();

          /* ── 14. 오류 수집 ── */
          result.functional.errsAfter = (win.__errs || []).slice(0, 5);
          check('콘솔 오류 0', (win.__errs || []).length === 0 && (result.functional.errsTip || []).length === 0, JSON.stringify((win.__errs || []).concat(result.functional.errsTip || [])));

          win.localStorage.removeItem('bc.state.v1:qa');
          result.functional.error = '';
        } catch (e) {
          result.functional.error = String(e);
        }
        result.functional.pass = result.checks.filter(function (c) { return c.ok; }).length;
        result.functional.fail = result.checks.filter(function (c) { return !c.ok; }).length;
      }
      frame.remove();
      out.textContent = JSON.stringify(result, null, 1);
    }
    result.done = true;
    window.__qa = result;
    out.textContent = JSON.stringify(result, null, 1);
  }

  window.__qa = result;
  if (location.hash.indexOf('#shot') === 0) { shotMode(location.hash); return; }
  run().catch(function (e) {
    result.errors.push(String(e));
    result.done = true;
    out.textContent = JSON.stringify(result, null, 1);
    window.__qa = result;
  });
})();
</script>
</body>
</html>
