<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QA · 바이블 컴패니언 v9.0</title>
<style>
  body{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;margin:16px;background:#fff;color:#111;font-size:12px}
  h1{font-size:15px;margin:0 0 10px}
  pre{white-space:pre-wrap;line-height:1.5;background:#f6f6f6;padding:12px;border-radius:8px}
  .f{position:absolute;left:-9999px;top:0;border:0}
  iframe{border:1px solid #ccc}
  #shotbox{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
  #shotbox figure{margin:0}
  #shotbox figcaption{font-size:11px;color:#555;padding:4px 0}
</style>
</head>
<body>
<h1>QA harness v9.0 — 360×780 / 390×844 / 430×932 기능 전수</h1>
<p style="margin:0 0 10px">측정: <code>qa.html</code> · 화면 캡처: <code>qa.html#shot?w=360&amp;p=chapter</code>
(p = home / goal / plan / planbar / plansheet / hledit / bible / book / bookheb / chapter / chapter2 / verse / sheet / pref / notes / searchbook / word)</p>
<pre id="out">running…</pre>
<div id="frames"></div>
<div id="shotbox"></div>
<script>
(function () {
  var WIDTHS = [360, 390, 430];
  var HEIGHTS = { 360: 780, 390: 844, 430: 932 };
  var ROUTES = [
    ['home', '#/home'],
    ['bible-home', '#/bible'],
    ['book-psa', '#/bible/psa'],
    ['book-gen', '#/bible/gen'],
    ['book-heb', '#/bible/heb'],
    ['chapter-gen1', '#/bible/gen/1'],
    ['chapter-psa23', '#/bible/psa/23?v=1'],
    ['chapter-rev21', '#/bible/rev/21'],
    ['verse-detail', '#/verse/jhn-3-16'],
    ['people-list', '#/per'],
    ['person-detail', '#/per/elijah'],
    ['situation', '#/sit/waiting'],
    ['background-list', '#/bg'],
    ['word-detail', '#/word/hesed'],
    ['notes', '#/notes'],
    ['search-word', '#/search?q=%EC%9D%80%ED%98%9C'],
    ['search-book', '#/search?q=%EC%9A%94%ED%95%9C%EB%B3%B5%EC%9D%8C'],
    ['about', '#/about']
  ];
  var PAGES = {
    home: '#/home', bible: '#/bible', book: '#/bible/psa', bookheb: '#/bible/heb',
    chapter: '#/bible/gen/1', chapter2: '#/bible/psa/23?v=1', verse: '#/verse/jhn-3-16',
    searchbook: '#/search?q=' + encodeURIComponent('히브리서'), word: '#/word',
    sheet: '#/bible/gen/1', pref: '#/bible/gen/1', notes: '#/notes', bookgen: '#/bible/gen',
    goal: '#/home', bar: '#/bible/psa/119', plan: '#/home', planbar: '#/bible/mat/10',
    plansheet: '#/home', hledit: '#/notes',
    planempty: '#/home', plancele: '#/home', planstreak: '#/home', plan189: '#/home', notes2: '#/notes',
    week: '#/home', pace: '#/home', notes9: '#/notes', plan120: '#/home', dark9: '#/home'
  };
  var QA = '?qa=1';
  var out = document.getElementById('out');
  var result = { version: 'v9.0', widths: {}, counts: {}, functional: {}, checks: [], errors: [] };

  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function todayKey() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function dayOff(n) {
    var d = new Date(); d.setDate(d.getDate() + n);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  /* 조건이 만족될 때까지 짧게 폴링 — 네트워크가 느린 순간을 고정 대기로 재면 오탐이 난다 */
  async function waitFor(fn, timeout) {
    var t0 = Date.now();
    while (Date.now() - t0 < (timeout || 3000)) {
      try { if (fn()) return true; } catch (e) { }
      await sleep(150);
    }
    return false;
  }

  function shotMode(hash) {
    var qs = hash.split('?')[1] || '';
    var q = {};
    qs.split('&').forEach(function (kv) {
      var p = kv.split('=');
      if (p[0]) q[p[0]] = decodeURIComponent(p[1] || '');
    });
    var w = parseInt(q.w, 10) || 360;
    var y = parseInt(q.y, 10) || 0;
    var page = PAGES[q.p] || '#/home';
    /* seed=1: 화면 확인용 예시 상태(읽은 장·목표·형광펜 메모)를 점검 키에만 심는다 */
    if (q.seed) {
      try {
        var d0 = new Date(), at = d0.toISOString();
        var dk9 = function (n) { var x = new Date(); x.setDate(x.getDate() + n); return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'); };
        /* seed=week/pace/notes/psalm120: v9 화면(주간 7칸·페이스 추천·노트 정렬/검색·150일 날짜 띠) */
        if (q.seed === 'week' || q.seed === 'pace' || q.seed === 'notes' || q.seed === 'psalm120') {
          var s9 = { bookmarks: [], notes: [], read: {}, days: {}, hl: [], pref: {}, last: null, plan: null };
          if (q.seed === 'week') {
            s9.days[dk9(0)] = 3; s9.days[dk9(-1)] = 2; s9.days[dk9(-2)] = 4;
            for (var wi = 1; wi <= 3; wi++) s9.read['gen:' + wi] = at;
            s9.last = { b: 'gen', ch: 3, at: at };
            s9.pref = { goal: 3 };
            s9.plan = { id: 'gospel30', start: dk9(-2), at: at };
            s9.notes = [{ id: 'nw1', ref: 'bv:gen:1:3', title: '빛과 혼돈', body: '혼돈 한가운데서도 말씀은 일하고 계셨다.', createdAt: at, updatedAt: at }];
            s9.hl = [{ ref: 'bv:gen:1:1', c: 'y', t: '태초에 하나님이 천지를 창조하시니라', n: '시작의 첫 문장', at: at }];
          } else if (q.seed === 'pace') {
            ['gen', 'exo', 'lev'].forEach(function (bk, i) {
              for (var ci = 1; ci <= 7; ci++) {
                var xd = new Date(); xd.setDate(xd.getDate() - [1, 5, 9][i]); xd.setHours(12, 0, 0, 0);
                s9.read[bk + ':' + ci] = xd.toISOString();
              }
            });
          } else if (q.seed === 'notes') {
            s9.notes = [
              { id: 'na', ref: 'bv:psa:23:1', title: '시편 묵상', body: '푸른 풀밭으로 인도하시네', createdAt: at, updatedAt: at },
              { id: 'nb', ref: 'bv:gen:1:3', title: '빛과 혼돈', body: '태초의 빛이 어둠을 밝혔다', createdAt: at, updatedAt: at },
              { id: 'nc', ref: '', title: '기도 제목', body: '수험과 가족을 위해', createdAt: at, updatedAt: at }
            ];
          } else {
            s9.plan = { id: 'psalm150', start: dk9(-119), at: at };
          }
          localStorage.setItem('bc.state.v1:qa', JSON.stringify(s9));
          document.querySelector('h1').textContent = '미리보기 ' + w + 'px · ' + page;
        } else if (q.seed === 'streak' || q.seed === 'cele') {
          var dk = function (n) { var x = new Date(); x.setDate(x.getDate() + n); return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'); };
          var dS = {}, rS = {};
          [-3, -2, -1].forEach(function (n) { dS[dk(n)] = 3; });
          for (var mi = 1; mi <= 9; mi++) rS['mat:' + mi] = at;
          if (q.seed === 'cele') { dS[dk(0)] = 3; for (var mj = 10; mj <= 12; mj++) rS['mat:' + mj] = at; }
          localStorage.setItem('bc.state.v1:qa', JSON.stringify({
            bookmarks: [{ ref: 'bv:gen:1:1', at: at }],
            notes: [{ id: 'n1', ref: 'bv:gen:1:3', title: '빛에 대한 묵상', body: '혼돈과 공허 한가운데서도 말씀은 이미 일하고 계셨다.', createdAt: at, updatedAt: at }],
            read: rS, days: dS, last: { b: 'mat', ch: q.seed === 'cele' ? 12 : 9, at: at },
            pref: { goal: 3 }, plan: { id: 'gospel30', start: dk(-3), at: at },
            hl: [{ ref: 'bv:gen:1:1', c: 'y', t: '태초에 하나님이 천지를 창조하시니라', n: '시작의 첫 문장', at: at }]
          }));
          document.querySelector('h1').textContent = '미리보기 ' + w + 'px · ' + page;
        } else {
        var k0 = d0.getFullYear() + '-' + String(d0.getMonth() + 1).padStart(2, '0') + '-' + String(d0.getDate()).padStart(2, '0');
        var days = {}; days[k0] = 3;
        localStorage.setItem('bc.state.v1:qa', JSON.stringify({
          bookmarks: [{ ref: 'bv:gen:1:1', at: at }],
          notes: [{ id: 'n1', ref: 'bv:gen:1:3', title: '빛에 대한 묵상', body: '혼돈과 공허 한가운데서도 말씀은 이미 일하고 계셨다.', createdAt: at, updatedAt: at }],
          read: { 'gen:1': at, 'gen:2': at, 'gen:3': at, 'mat:1': at, 'mat:2': at, 'mat:3': at }, days: days,
          last: { b: 'gen', ch: 3, at: at }, pref: { goal: 3 },
          plan: { id: 'gospel30', start: (function () { var x = new Date(); x.setDate(x.getDate() - 3); return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'); })(), at: at },
          hl: [
            { ref: 'bv:gen:1:1', c: 'y', t: '태초에 하나님이 천지를 창조하시니라', n: '시작의 첫 문장', at: at },
            { ref: 'bv:gen:1:3', c: 'g', t: '하나님이 가라사대 빛이 있으라 하시매 빛이 있었고', n: '말씀과 성취 사이의 간격 없음', at: at },
            { ref: 'bv:gen:1:4', c: 'b', t: '그 빛이 하나님의 보시기에 좋았더라 하나님이 빛과 어두움을 나누사', n: '', at: at }
          ]
        }));
        }
      } catch (e) { }
    }
    document.querySelector('h1').textContent = '미리보기 ' + w + 'px · ' + page + (y ? ' · y=' + y : '');
    out.style.display = 'none';
    var fig = document.createElement('figure');
    var cap = document.createElement('figcaption');
    cap.textContent = w + 'px · ' + page + (y ? ' (스크롤 ' + y + ')' : '');
    var frame = document.createElement('iframe');
    frame.width = w; frame.height = 780; frame.src = './index.html?qa=1&v=' + Date.now() + page;
    frame.onload = function () {
      setTimeout(function () {
        try {
          if (q.p === 'sheet') {
            var row = frame.contentWindow.document.querySelector('#view .vblock[data-v="1"] .vrow');
            if (row) row.click();
          }
          if (q.p === 'pref') {
            var aa = frame.contentWindow.document.querySelector('#view [data-act="rdpref"]');
            if (aa) aa.click();
          }
          if (q.p === 'plansheet') {
            var pg = frame.contentWindow.document.querySelector('#view .plancard .pchg');
            if (pg) pg.click();
          }
          if (q.p === 'hledit') {
            var hm = frame.contentWindow.document.querySelector('#view .hlmedit');
            if (hm) hm.click();
          }
          if (q.p === 'pace' || q.p === 'plan120') {
            var pg9 = frame.contentWindow.document.querySelector('#view .plancard .pchg');
            if (pg9) pg9.click();
          }
          if (q.p === 'notes9') {
            var bs9 = frame.contentWindow.document.querySelector('#view .nso[data-s="book"]');
            if (bs9) bs9.click();
            var ni9 = frame.contentWindow.document.getElementById('nq');
            if (ni9) { ni9.value = '빛'; ni9.dispatchEvent(new frame.contentWindow.Event('input', { bubbles: true })); }
          }
          if (q.p === 'dark9') {
            var tb9 = frame.contentWindow.document.getElementById('themeBtn');
            if (tb9) tb9.click();
          }
          if (y) setTimeout(function () { try { frame.contentWindow.scrollTo(0, y); } catch (e) { } }, 700);
        } catch (e) { }
      }, 1600);
    };
    fig.appendChild(cap); fig.appendChild(frame);
    document.getElementById('shotbox').appendChild(fig);
    result.mode = 'shot';
    window.__qa = result;
    return true;
  }

  function measure(win, W) {
    var doc = win.document;
    var de = doc.documentElement;
    var over = [];
    var nodes = doc.querySelectorAll('body *');
    for (var i = 0; i < nodes.length; i++) {
      var el = nodes[i];
      if (el.id === 'toast') continue;
      if (el.closest && el.closest('#toast')) continue;
      if (el.closest && el.closest('.chips')) continue; /* 의도된 가로 스크롤 칩 줄 */
      var r = el.getBoundingClientRect();
      if (!r.width && !r.height) continue;
      if (r.right > W + 1.5 || r.left < -1.5) {
        over.push(el.tagName.toLowerCase() + (el.id ? '#' + el.id : '') + '.' + String(el.className || '').slice(0, 30) + ' [' + Math.round(r.left) + ',' + Math.round(r.right) + ']');
      }
    }
    var view = doc.getElementById('view');
    var vt = doc.querySelector('#view .vt');
    return {
      width: W,
      hOverflow: de.scrollWidth - de.clientWidth,
      overflowCount: over.length,
      overflow: over.slice(0, 6),
      textLen: view ? view.innerText.replace(/\s+/g, ' ').trim().length : 0,
      items: doc.querySelectorAll('#view .item').length,
      books: doc.querySelectorAll('#view .bkbtn').length,
      chapters: doc.querySelectorAll('#view .chbtn').length,
      chaptersRead: doc.querySelectorAll('#view .chbtn.rd').length,
      readerVerses: doc.querySelectorAll('#view .vblock').length,
      readerBadges: doc.querySelectorAll('#view .vhd').length,
      hlBlocks: doc.querySelectorAll('#view .vblock[class*="hl-"]').length,
      guide: doc.querySelectorAll('#view .guide').length,
      guideOpen: doc.querySelectorAll('#view .guide.on').length,
      chapintro: doc.querySelectorAll('#view .chapintro').length,
      chapIntroOpen: doc.querySelectorAll('#view .chapintro.wide').length,
      chapLines: doc.querySelectorAll('#view .chapintro .ciline').length,
      tools: doc.querySelectorAll('#view .rtools').length,
      readBtn: doc.querySelectorAll('#view [data-act="readmark"]').length,
      progBars: doc.querySelectorAll('#view .pbar').length,
      tread: (doc.querySelector('#view .tread') || {}).textContent ? doc.querySelector('#view .tread').textContent.replace(/\s+/g, ' ').trim().slice(0, 90) : '',
      bookcards: doc.querySelectorAll('#view .bookcard').length,
      textSearchHits: doc.querySelectorAll('#view .vhit').length,
      hlNotes: doc.querySelectorAll('#view .hli').length,
      hlRows: doc.querySelectorAll('#view .hlrow').length,
      moreHits: doc.querySelectorAll('#view .morehits').length,
      planCards: doc.querySelectorAll('#view .plancard').length,
      planChips: doc.querySelectorAll('#view .plancard .pch').length,
      planStrip: doc.querySelectorAll('#view .planstrip').length,
      planStripChips: doc.querySelectorAll('#view .planstrip .pch').length,
      planBar: (doc.querySelector('#view .rbmplan') || {}).textContent || '',
      planDay: (doc.querySelector('#view .plancard .pday') || {}).textContent || '',
      planPill: (doc.querySelector('#view .plancard .ppill') || {}).textContent || '',
      rdbar: doc.querySelectorAll('#view .rdbar').length,
      goalCards: doc.querySelectorAll('#view .goalcard').length,
      goalChips: doc.querySelectorAll('#view .goalcard .gchip').length,
      navTabs: doc.querySelectorAll('#tabs .nb').length,
      vtFontSize: vt ? win.getComputedStyle(vt).fontSize : '',
      errs: (win.__errs || []).slice(0, 5)
    };
  }

  var CURW = 360;
  function check(name, ok, actual) {
    result.checks.push({ name: name, w: CURW, ok: !!ok, actual: actual === undefined ? '' : actual });
    return !!ok;
  }

  async function run() {
    for (var w = 0; w < WIDTHS.length; w++) {
      var W = WIDTHS[w];
      try { localStorage.removeItem('bc.state.v1:qa'); localStorage.removeItem('bc.theme.v1:qa'); } catch (e) { }
      {
        /* v4.0 저장 형식(북마크·노트만)으로 시작해 새 필드를 더해도 기존 데이터가 남는지 본다
           기능 검증을 360·390·430 세 폭에서 같은 조건으로 돌린다 */
        try {
          localStorage.setItem('bc.state.v1:qa', JSON.stringify({
            bookmarks: [{ ref: 'sit:waiting', at: '2026-11-18T10:00:00.000Z' }],
            notes: [{ id: 'nold1', title: '지난 노트', body: 'v4.0에서 쓴 묵상', createdAt: '2026-11-18T10:00:00.000Z', updatedAt: '2026-11-18T10:00:00.000Z' }]
          }));
        } catch (e) { }
      }
      var frame = document.createElement('iframe');
      frame.className = 'f';
      frame.width = W; frame.height = HEIGHTS[W] || 780;
      frame.setAttribute('allow', 'clipboard-write');
      frame.src = './index.html' + QA + '&cb=' + Date.now() + '#/home';
      document.getElementById('frames').appendChild(frame);
      await new Promise(function (res) { frame.onload = res; });
      await sleep(900);
      var win = frame.contentWindow;
      var doc = win.document;
      result.widths[W] = {};

      if (W === 360) {
        result.counts = {
          booksData: (win.BC.books || []).length,
          guideData: Object.keys(win.BC.bookGuide || {}).length,
          vmapData: Object.keys(win.BC.vmap || {}).length,
          words: (win.BC.words || []).length,
          peopleData: (win.BC.characters || []).length,
          versesData: (win.BC.verses || []).length,
          totalChapters: (win.BC.books || []).reduce(function (n, b) { return n + b.ch; }, 0)
        };
      }

      for (var i = 0; i < ROUTES.length; i++) {
        var name = ROUTES[i][0], hash = ROUTES[i][1];
        win.location.hash = hash;
        await sleep(i === 0 ? 700 : 950);
        var m = measure(win, W);
        m.route = name;
        result.widths[W][name] = m;
        if (m.errs.length) result.errors.push({ w: W, route: name, errs: m.errs });
      }

      {
        CURW = W;
        try {
          check('점검 모드 저장 키 분리', win.BC.stateKey === 'bc.state.v1:qa', String(win.BC.stateKey));
          var store = function () {
            try { return JSON.parse(win.localStorage.getItem('bc.state.v1:qa') || '{}'); } catch (e) { return {}; }
          };

          /* ── 0. v4.0 저장소 호환 ── */
          var seeded = store();
          check('v4 북마크 유지', (seeded.bookmarks || []).length === 1, JSON.stringify(seeded.bookmarks || []));
          check('v4 노트 유지', (seeded.notes || []).length === 1 && seeded.notes[0].title === '지난 노트', (seeded.notes || []).length);
          win.location.hash = '#/notes';
          await sleep(700);
          check('노트 화면에 기존 노트 보임', (doc.querySelector('#view') || {}).textContent.indexOf('지난 노트') >= 0, '');

          /* ── 1. 통독: 장 읽음 표시 ── */
          win.location.hash = '#/bible/gen/1';
          await sleep(1100);
          var rbtn = doc.querySelector('#view [data-act="readmark"]');
          check('읽기 도구줄 표시', !!rbtn, rbtn ? rbtn.textContent.trim() : 'none');
          if (rbtn) rbtn.click();
          await sleep(700);
          var st1 = store();
          check('읽음 기록 저장(gen:1)', !!(st1.read && st1.read['gen:1']), st1.read ? Object.keys(st1.read).join(',') : 'no read');
          check('오늘 읽은 장 수 1', st1.days && Object.values(st1.days)[0] === 1, JSON.stringify(st1.days || {}));
          var rb2 = doc.querySelector('#view [data-act="readmark"]');
          check('읽음 버튼 눌림 상태', rb2 && rb2.getAttribute('aria-pressed') === 'true', rb2 ? rb2.getAttribute('aria-pressed') : 'none');
          var endTxt = (doc.querySelector('#view .chapend') || {}).textContent || '';
          check('장 끝 읽음·이어읽기 버튼', endTxt.indexOf('2장 이어 읽기') >= 0, endTxt.replace(/\s+/g, ' ').trim());

          /* ── 2. 책 화면 진도 ── */
          win.location.hash = '#/bible/gen';
          await sleep(800);
          var rdCh = doc.querySelectorAll('#view .chbtn.rd').length;
          var bookProg = (doc.querySelector('#view .tread') || {}).textContent || '';
          check('장 격자 읽음 표시 1개', rdCh === 1, 'rd=' + rdCh);
          check('책 진도 표시', bookProg.replace(/\s+/g, '').indexOf('통독1/50장') >= 0, bookProg.replace(/\s+/g, ' ').trim());
          check('이어 읽기 버튼(2장부터)', ((doc.querySelector('#view .actrow .btn.primary') || {}).textContent || '').indexOf('2장부터') >= 0, (doc.querySelector('#view .actrow .btn.primary') || {}).textContent);

          /* ── 3. 성경 목록 진도 ── */
          win.location.hash = '#/bible';
