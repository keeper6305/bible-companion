<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QA · 바이블 컴패니언 v3</title>
<style>
  body{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;margin:16px;background:#fff;color:#111;font-size:12px}
  h1{font-size:15px;margin:0 0 10px}
  pre{white-space:pre-wrap;line-height:1.5;background:#f6f6f6;padding:12px;border-radius:8px}
  .f{position:absolute;left:-9999px;top:0;border:0}
  iframe{border:1px solid #ccc}
  #shotbox{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
  #shotbox figure{margin:0}
  #shotbox figcaption{font-size:11px;color:#555;padding:4px 0}
</style>
</head>
<body>
<h1>QA harness — 360 / 390 / 430</h1>
<p style="margin:0 0 10px">측정: <code>qa.html</code> · 모바일 화면 캡처: <code>qa.html#shot?w=360&amp;p=per</code> (p = home / per / person / bible / book / chapter / chapter2 / verse)</p>
<pre id="out">running…</pre>
<div id="frames"></div>
<div id="shotbox"></div>
<script>
(function () {
  var WIDTHS = [360, 390, 430];
  var ROUTES = [
    ['home', '#/home'],
    ['bible-home', '#/bible'],
    ['book-psa', '#/bible/psa'],
    ['book-gen', '#/bible/gen'],
    ['chapter-gen1', '#/bible/gen/1'],
    ['chapter-psa23', '#/bible/psa/23?v=1'],
    ['chapter-rev21', '#/bible/rev/21'],
    ['verse-detail', '#/verse/jhn-3-16'],
    ['people-list', '#/per'],
    ['person-detail', '#/per/elijah'],
    ['person-new', '#/per/bartimaeus'],
    ['situation', '#/sit/waiting'],
    ['background-list', '#/bg'],
    ['word-detail', '#/word/hesed'],
    ['word-new', '#/word/logos'],
    ['notes', '#/notes'],
    ['search', '#/search?q=%EC%9D%80%ED%98%9C'],
    ['about', '#/about']
  ];
  var PAGES = {
    home: '#/home', per: '#/per', person: '#/per/elijah', bible: '#/bible',
    book: '#/bible/psa', chapter: '#/bible/gen/1', chapter2: '#/bible/psa/23?v=1',
    verse: '#/verse/jhn-3-16', situation: '#/sit/waiting'
  };
  var out = document.getElementById('out');
  var result = { widths: {}, counts: {}, functional: {}, errors: [] };

  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  /* ── 화면 캡처 모드 ── */
  function shotMode(hash) {
    var qs = hash.split('?')[1] || '';
    var q = {};
    qs.split('&').forEach(function (kv) {
      var p = kv.split('=');
      if (p[0]) q[p[0]] = decodeURIComponent(p[1] || '');
    });
    var w = parseInt(q.w, 10) || 360;
    var y = parseInt(q.y, 10) || 0;
    var page = PAGES[q.p] || '#/home';
    document.querySelector('h1').textContent = '미리보기 ' + w + 'px · ' + page + (y ? ' · y=' + y : '');
    out.style.display = 'none';
    var fig = document.createElement('figure');
    var cap = document.createElement('figcaption');
    cap.textContent = w + 'px · ' + page + (y ? ' (스크롤 ' + y + ')' : '');
    var frame = document.createElement('iframe');
    frame.width = w; frame.height = 780; frame.src = './index.html' + page;
    frame.onload = function () {
      if (!y) return;
      setTimeout(function () { try { frame.contentWindow.scrollTo(0, y); } catch (e) {} }, 500);
    };
    fig.appendChild(cap); fig.appendChild(frame);
    document.getElementById('shotbox').appendChild(fig);
    result.mode = 'shot';
    window.__qa = result;
    return true;
  }

  function measure(win, W) {
    var doc = win.document;
    var de = doc.documentElement;
    var over = [];
    var nodes = doc.querySelectorAll('body *');
    for (var i = 0; i < nodes.length; i++) {
      var el = nodes[i];
      if (el.id === 'toast') continue;
      if (el.closest && el.closest('#toast')) continue;
      var r = el.getBoundingClientRect();
      if (!r.width && !r.height) continue;
      if (r.right > W + 1.5 || r.left < -1.5) {
        over.push(el.tagName.toLowerCase() + (el.id ? '#' + el.id : '') + '.' + String(el.className || '').slice(0, 30) + ' [' + Math.round(r.left) + ',' + Math.round(r.right) + ']');
      }
    }
    var view = doc.getElementById('view');
    return {
      width: W,
      hOverflow: de.scrollWidth - de.clientWidth,
      overflowCount: over.length,
      overflow: over.slice(0, 6),
      textLen: view ? view.innerText.replace(/\s+/g, ' ').trim().length : 0,
      items: doc.querySelectorAll('#view .item').length,
      books: doc.querySelectorAll('#view .bkbtn').length,
      chapters: doc.querySelectorAll('#view .chbtn').length,
      readerVerses: doc.querySelectorAll('#view .vblock').length,
      readerBadges: doc.querySelectorAll('#view .vhd').length,
      textSearchHits: doc.querySelectorAll('#view .vhit').length,
      timeline: doc.querySelectorAll('#view .tlitem').length,
      navTabs: doc.querySelectorAll('#tabs .nb').length,
      errs: (win.__errs || []).slice(0, 5)
    };
  }

  async function run() {
    for (var w = 0; w < WIDTHS.length; w++) {
      var W = WIDTHS[w];
      var frame = document.createElement('iframe');
      frame.className = 'f';
      frame.width = W; frame.height = 780;
      frame.src = './index.html#/home';
      document.getElementById('frames').appendChild(frame);
      await new Promise(function (res) { frame.onload = res; });
      await sleep(700);
      var win = frame.contentWindow;
      result.widths[W] = {};

      if (W === 360) {
        result.counts = {
          peopleData: (win.BC.characters || []).length,
          booksData: (win.BC.books || []).length,
          versesData: (win.BC.verses || []).length,
          situations: (win.BC.situations || []).length,
          backgrounds: (win.BC.background || []).length,
          words: (win.BC.words || []).length
        };
      }

      for (var i = 0; i < ROUTES.length; i++) {
        var name = ROUTES[i][0], hash = ROUTES[i][1];
        win.location.hash = hash;
        await sleep(i === 0 ? 500 : 800);
        var m = measure(win, W);
        m.route = name;
        result.widths[W][name] = m;
        if (m.errs.length) result.errors.push({ w: W, route: name, errs: m.errs });
      }

      if (W === 360) {
        try {
          win.localStorage.removeItem('bc.state.v1');
          /* 인물 필터: 전체 */
          win.location.hash = '#/per';
          await sleep(600);
          result.functional.peopleAll = win.document.querySelectorAll('#view .item').length;
          var chip = win.document.querySelector('[data-f="per:tag:기다림"]');
          if (chip) { chip.click(); await sleep(500); result.functional.peopleFiltered = win.document.querySelectorAll('#view .item').length; }
          var reset = win.document.querySelector('[data-act="perreset"]');
          if (reset) { reset.click(); await sleep(400); result.functional.peopleAfterReset = win.document.querySelectorAll('#view .item').length; }
          /* 구절 검색 */
          win.location.hash = '#/search?q=' + encodeURIComponent('요한복음 3:16');
          await sleep(700);
          result.functional.refSearchTop = (win.document.querySelector('#view .item .t') || {}).textContent || '';
          /* 노트 저장 */
          win.location.hash = '#/edit/new';
          await sleep(400);
          var t = win.document.getElementById('ntTitle');
          var b = win.document.getElementById('ntBody');
          t.value = 'QA 노트'; b.value = '테스트 본문';
          t.dispatchEvent(new win.Event('input', { bubbles: true }));
          b.dispatchEvent(new win.Event('input', { bubbles: true }));
          win.document.querySelector('[data-act="savenote"]').click();
          await sleep(500);
          var st = JSON.parse(win.localStorage.getItem('bc.state.v1') || '{}');
          result.functional.noteSaved = (st.notes || []).length;
          /* 구절 북마크 */
          win.location.hash = '#/verse/gen-1-1';
          await sleep(600);
          var bm = win.document.querySelector('.detail-head [data-bm]');
          if (bm) { bm.click(); await sleep(300); }
          var st2 = JSON.parse(win.localStorage.getItem('bc.state.v1') || '{}');
          result.functional.bookmarkRef = ((st2.bookmarks || [])[0] || {}).ref;

          /* 본문 리더: 창세기 1장 전체 절 수 + 핵심 구절 배지 */
          win.location.hash = '#/bible/gen/1';
          await sleep(1500);
          result.functional.gen1Verses = win.document.querySelectorAll('#view .vblock').length;
          result.functional.gen1Badges = win.document.querySelectorAll('#view .vhd').length;

          /* 절 선택 → 북마크 */
          var row = win.document.querySelector('#view .vblock .vrow');
          if (row) { row.click(); await sleep(200); }
          var vbm = win.document.querySelector('#view .vblock.vopen [data-bm]');
          if (vbm) { vbm.click(); await sleep(250); }
          var st3 = JSON.parse(win.localStorage.getItem('bc.state.v1') || '{}');
          result.functional.verseBookmarkRef = ((st3.bookmarks || [])[0] || {}).ref;

          /* 구절 참조 → 본문 바로 열기 카드 */
          win.location.hash = '#/bible';
          await sleep(300);
          win.location.hash = '#/search?q=' + encodeURIComponent('시 23:1');
          await sleep(900);
          result.functional.refCard = (win.document.querySelector('#view .refcard .t') || {}).textContent || '';

          /* 본문 키워드 검색 */
          win.location.hash = '#/search?q=' + encodeURIComponent('선한 목자');
          await sleep(2500);
          result.functional.textSearchHits = win.document.querySelectorAll('#view .vhit').length;

          /* 시편 23편 본문 확인 */
          win.location.hash = '#/bible/psa/23?v=1';
          await sleep(1200);
          result.functional.psa23Verses = win.document.querySelectorAll('#view .vblock').length;
          result.functional.psa23Focus = win.document.querySelectorAll('#view .vblock.focus').length;
          var firstTxt = (win.document.querySelector('#view .vblock .vt') || {}).textContent || '';
          result.functional.psa23First = firstTxt.slice(0, 24);

          win.localStorage.removeItem('bc.state.v1');
        } catch (e) {
          result.functional.error = String(e);
        }
      }
      frame.remove();
      out.textContent = JSON.stringify(result, null, 1);
    }
    result.done = true;
    window.__qa = result;
    out.textContent = JSON.stringify(result, null, 1);
  }

  window.__qa = result;
  if (location.hash.indexOf('#shot') === 0) { shotMode(location.hash); return; }
  run().catch(function (e) {
    result.errors.push(String(e));
    out.textContent = JSON.stringify(result, null, 1);
  });
})();
</script>
</body>
</html>
